{{- if and .Values.cmsUI.enabled .Values.cmsUI.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "agentic-cms.componentName" (dict "context" . "component" "cms-ui") }}
  labels:
    {{- include "agentic-cms.labels" . | nindent 4 }}
    {{- include "agentic-cms.selectorLabels" (dict "context" . "component" "cms-ui") | nindent 4 }}
  {{- with .Values.cmsUI.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.cmsUI.ingress.className }}
  {{- if .Values.cmsUI.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.cmsUI.ingress.host | quote }}
      secretName: {{ .Values.cmsUI.ingress.tls.secretName }}
  {{- end }}
  rules:
    - {{- if .Values.cmsUI.ingress.host }}
      host: {{ .Values.cmsUI.ingress.host | quote }}
      {{- end }}
      http:
        paths:
          - path: {{ .Values.cmsUI.ingress.path | default "/" }}
            pathType: {{ .Values.cmsUI.ingress.pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "agentic-cms.componentName" (dict "context" . "component" "cms-ui") }}
                port:
                  number: {{ .Values.cmsUI.service.port }}
{{- end }}
