{{- $chartSecretValues := dict }}
{{- range $key, $cfg := .Values.backend.secrets }}
{{- if and (not $cfg.existingSecret) $cfg.value }}
{{- $_ := set $chartSecretValues $key $cfg.value }}
{{- end }}
{{- end }}
{{- if $chartSecretValues }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentic-cms.componentName" (dict "context" . "component" "backend") }}
  labels:
    {{- include "agentic-cms.labels" . | nindent 4 }}
    {{- include "agentic-cms.selectorLabels" (dict "context" . "component" "backend") | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := $chartSecretValues }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
