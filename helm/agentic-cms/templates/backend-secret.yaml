{{- if .Values.backend.databaseUrl.value }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentic-cms.componentName" (dict "context" . "component" "backend") }}
  labels:
    {{- include "agentic-cms.labels" . | nindent 4 }}
    {{- include "agentic-cms.selectorLabels" (dict "context" . "component" "backend") | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.backend.databaseUrl.value | quote }}
{{- end }}
