
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    listen [::]:80;
    server_name localhost _;

    # Health check endpoint for container orchestrators / load balancers
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # 1. Backend REST API
    location /api/ {
        set $backend_api http://backend:3000;
        proxy_pass $backend_api;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
    }

    # 2. Backend Media & File Uploads
    location /uploads/ {
        set $backend_uploads http://backend:3000;
        proxy_pass $backend_uploads;
        proxy_buffering on;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 3. CMS UI (Admin Dashboard - redirect to CMS UI subdomain)
    location /admin {
        return 302 http://cms.localhost/;
    }

    # Vite static assets (for CMS UI)
    location /assets/ {
        set $cms_ui http://cms-ui:5173;
        proxy_pass $cms_ui;
        proxy_buffering on;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # 4. Frontend Web Application (Public Next.js Site)
    location / {
        set $frontend http://frontend:3000;
        proxy_pass $frontend;
        proxy_buffering off;
    }
}

# CMS UI Subdomain (e.g. cms.localhost or admin.yourdomain.com)
server {
    listen 80;
    server_name cms.localhost admin.localhost;

    location / {
        set $cms_ui http://cms-ui:5173;
        proxy_pass $cms_ui;
    }

    location /api/ {
        set $backend_api http://backend:3000;
        proxy_pass $backend_api;
    }
}

# API Subdomain (e.g. api.localhost or api.yourdomain.com)
server {
    listen 80;
    server_name api.localhost;

    client_max_body_size 100M;

    location / {
        set $backend_api http://backend:3000;
        proxy_pass $backend_api;
    }
}
